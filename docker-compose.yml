version: '3.8'

services:
  # 1. Database Vettoriale Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    restart: always
    ports:
      # Espone la porta interna 6333 sulla porta esterna definita nel .env
      - "${QDRANT_PORT}:6333" # Per API REST/gRPC
      - "6334:6334" # Per UI web
    volumes:
      - ./qdrant_data:/qdrant/storage # Mantiene i dati permanenti

  # 2. Server LLM Locale Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    restart: always
    ports:
      # Espone la porta interna 11434 sulla porta esterna
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ./ollama_models:/root/.ollama

  # 3. Applicazione FastAPI
  rag_api:
    # L'immagine viene costruita a partire dal Dockerfile nella directory corrente
    build: . 
    container_name: rag_api_server
    ports:
      # Espone la porta interna 8000 (dell'applicazione) sulla stessa porta esterna (default 8000)
      - "8000:8000"
    volumes:
      # Montaggio a caldo: utile in sviluppo per vedere i cambiamenti senza ricostruire
      - .:/app 
    environment:
      # --- VARIABILI DALLO .ENV PASSATE AL CONTAINER ---
      # Le variabili chiave per la comunicazione tra i servizi Docker
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL}" # Ora http://ollama:11434
      QDRANT_HOST: "${QDRANT_HOST}"         # Ora qdrant
      QDRANT_PORT: "${QDRANT_PORT}"         # 6333
      
      # Variabili di configurazione LLM, Embedding e Chunking
      OLLAMA_MODEL_NAME: "${OLLAMA_MODEL_NAME}"
      EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME}"
      QDRANT_COLLECTION_NAME: "${QDRANT_COLLECTION_NAME}"
      CHUNK_SIZE: "${CHUNK_SIZE}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP}"
      
      # Variabili di Progetto (optionali)
      PROJECT_NAME: "${PROJECT_NAME}"
      ENVIRONMENT: "${ENVIRONMENT}"
      DEBUG: "${DEBUG}"
      
    depends_on:
      - qdrant
      - ollama
    # Comando di avvio dell'app FastAPI
    command: uvicorn RAG.RagController:app --host 0.0.0.0 --port 8000 --reload